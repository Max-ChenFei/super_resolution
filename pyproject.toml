[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "super_resolution_chaldene"
version = "0.1.0"
description = "Super resolution based on EMDiffuse"
authors = [{ name = "Fei Chen", email = "boxchenfei@gmail.com" }]
readme = "README.md"
requires-python = ">=3.6"


[tool.setuptools.packages.find]
where = ["."]
include = ["super_resolution*"]

[tool.setuptools.package-data]
super_resolution = ["config/*.json"]  # Include JSON files in the package
